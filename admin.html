<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student ID CMS Admin</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#eef2ff,#dbeafe,#e0f2fe);
padding:16px;
min-height:100vh;
}

.container{
max-width:1200px;
margin:auto;
background:white;
padding:18px;
border-radius:22px;
box-shadow:0 15px 40px rgba(0,0,0,0.12);
}

h1{
text-align:center;
margin-bottom:18px;
font-size:30px;
color:#111827;
}

.analytics{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:14px;
margin-bottom:20px;
}

.card{
background:linear-gradient(135deg,#2563eb,#1d4ed8);
color:white;
padding:18px;
border-radius:18px;
box-shadow:0 10px 25px rgba(37,99,235,0.25);
}

.card h3{
font-size:14px;
margin-bottom:10px;
font-weight:700;
}

.card p{
font-size:28px;
font-weight:900;
}

.section{
background:#f8fafc;
padding:18px;
border-radius:18px;
margin-bottom:20px;
border:1px solid #e5e7eb;
}

.section h2{
margin-bottom:14px;
font-size:20px;
color:#111827;
}

input,
textarea,
select{
width:100%;
padding:14px;
margin:8px 0;
border:1px solid #d1d5db;
border-radius:12px;
font-size:15px;
background:white;
}

textarea{
min-height:100px;
resize:vertical;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:14px;
}

.button-row{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-top:10px;
}

button{
padding:14px 18px;
border:none;
border-radius:12px;
cursor:pointer;
font-size:15px;
font-weight:700;
}

.saveBtn{
background:#16a34a;
color:white;
}

.loadBtn{
background:#2563eb;
color:white;
}

.deleteBtn{
background:#dc2626;
color:white;
}

.logoutBtn{
background:#7c3aed;
color:white;
}

.exportBtn{
background:#0891b2;
color:white;
}

.importBtn{
background:#ea580c;
color:white;
}

.toggle-row{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:12px;
margin-top:10px;
}

.toggle-box{
background:white;
padding:14px;
border-radius:14px;
border:1px solid #d1d5db;
}

.toggle-box label{
display:flex;
align-items:center;
gap:10px;
font-weight:700;
}

.toggle-box input[type="checkbox"]{
width:20px;
height:20px;
margin:0;
}

.upload-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:14px;
}

.upload-box{
background:white;
border:2px dashed #93c5fd;
padding:18px;
border-radius:18px;
text-align:center;
cursor:pointer;
transition:0.3s;
}

.upload-box:hover{
background:#eff6ff;
}

.upload-box h3{
font-size:16px;
margin-bottom:8px;
}

.upload-box p{
font-size:13px;
color:#6b7280;
}

.upload-box input{
display:none;
}

.progress{
height:10px;
background:#e5e7eb;
border-radius:999px;
overflow:hidden;
margin-top:10px;
display:none;
}

.progress-fill{
height:100%;
width:0%;
background:#2563eb;
}

.college-dropdown-box{
position:relative;
}

.college-dropdown{
position:absolute;
top:100%;
left:0;
width:100%;
background:white;
border:1px solid #d1d5db;
border-radius:14px;
max-height:250px;
overflow-y:auto;
z-index:9999;
box-shadow:0 12px 25px rgba(0,0,0,0.12);
display:none;
}

.college-item{
padding:14px;
cursor:pointer;
border-bottom:1px solid #f1f5f9;
}

.college-item:hover{
background:#eff6ff;
}

.position-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:12px;
}

.hidden{
display:none;
}

@media(max-width:768px){
h1{
font-size:24px;
}

button{
width:100%;
}
}
</style>
</head>
<body>

<div class="container">

<h1>Student ID CMS Admin Panel</h1>

<div class="analytics">
<div class="card">
<h3>Total Colleges</h3>
<p id="totalColleges">0</p>
</div>

<div class="card">
<h3>Active Colleges</h3>
<p id="activeColleges">0</p>
</div>

<div class="card">
<h3>Featured Colleges</h3>
<p id="featuredColleges">0</p>
</div>

<div class="card">
<h3>Storage Used</h3>
<p id="storageUsed">0 MB</p>
</div>
</div>

<div class="section">
<h2>College Search</h2>

<div class="college-dropdown-box">
<input
type="text"
id="collegeSelect"
placeholder="Search / Select College"
autocomplete="off"
onclick="toggleAdminDropdown()"
oninput="filterAdminCollegeList()"
>
<div id="adminCollegeDropdown" class="college-dropdown"></div>
</div>

<div class="button-row">
<button class="loadBtn" onclick="loadCollege()">Load College</button>
<button class="deleteBtn" onclick="deleteCollege()">Delete College</button>
<button class="logoutBtn" onclick="logout()">Logout</button>
<button class="exportBtn" onclick="exportBackup()">Export Backup</button>
<button class="importBtn" onclick="document.getElementById('importBackup').click()">Import Backup</button>
<input type="file" id="importBackup" class="hidden" accept=".json">
</div>
</div>

<div class="section">
<h2>College Information</h2>

<div class="grid">
<input id="collegeNameBn" placeholder="College Name Bangla">
<input id="collegeNameEn" placeholder="College Name English">
<input id="established" placeholder="Established">
<input id="phone" placeholder="Phone">
<input id="email" placeholder="Email">
<input id="website" placeholder="Website">
<input id="displayOrder" type="number" placeholder="Display Order">
<select id="defaultLogoMode">
<option value="transparent">Transparent Logo</option>
<option value="box">White Box Logo</option>
</select>
</div>

<textarea id="address" placeholder="Address"></textarea>
<textarea id="aliases" placeholder="Aliases (one per line)&#10;Govt Barishal College&#10;Barishal College&#10;gbc"></textarea>

<div class="toggle-row">
<div class="toggle-box">
<label>
<input type="checkbox" id="isActive" checked>
Active College
</label>
</div>

<div class="toggle-box">
<label>
<input type="checkbox" id="isFeatured">
Featured College
</label>
</div>
</div>
</div>

<div class="section">
<h2>Image Uploads</h2>

<div class="upload-grid">

<label class="upload-box">
<h3>Transparent Logo</h3>
<p>PNG / JPG / WEBP</p>
<input type="file" id="transparentLogoFile" accept=".png,.jpg,.jpeg,.webp">
<div class="progress" id="transparentProgress">
<div class="progress-fill" id="transparentProgressFill"></div>
</div>
</label>

<label class="upload-box">
<h3>White Box Logo</h3>
<p>PNG / JPG / WEBP</p>
<input type="file" id="whiteLogoFile" accept=".png,.jpg,.jpeg,.webp">
<div class="progress" id="whiteProgress">
<div class="progress-fill" id="whiteProgressFill"></div>
</div>
</label>

<label class="upload-box">
<h3>Principal Signature</h3>
<p>PNG / JPG / WEBP</p>
<input type="file" id="signatureFile" accept=".png,.jpg,.jpeg,.webp">
<div class="progress" id="signatureProgress">
<div class="progress-fill" id="signatureProgressFill"></div>
</div>
</label>

<label class="upload-box">
<h3>Watermark / Background</h3>
<p>PNG / JPG / WEBP</p>
<input type="file" id="watermarkFile" accept=".png,.jpg,.jpeg,.webp">
<div class="progress" id="watermarkProgress">
<div class="progress-fill" id="watermarkProgressFill"></div>
</div>
</label>

</div>
</div>

<div class="section">
<h2>Design Settings</h2>

<div class="position-grid">
<input id="logoPosX" type="number" placeholder="Logo X">
<input id="logoPosY" type="number" placeholder="Logo Y">
<input id="logoSize" type="number" placeholder="Logo Size">

<input id="headerPosX" type="number" placeholder="Header X">
<input id="headerPosY" type="number" placeholder="Header Y">
<input id="headerSize" type="number" placeholder="Header Size">
</div>
</div>

<div class="section">
<h2>Add New College</h2>

<div class="grid">
<input id="newCollegeId" placeholder="college id (example: govt_barishal_college)">
<input id="newCollegeName" placeholder="college display name">
</div>

<div class="button-row">
<button class="saveBtn" onclick="addCollege()">Add College</button>
<button class="saveBtn" onclick="saveCollege()">Save Changes</button>
</div>
</div>

</div>

<script type="module" src="admin.js"></script>

</body>
</html>
