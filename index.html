<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student ID Card Generator</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet" href="css/main.css">
</head>

<body>

<div class="form-box">

<h2>ID Card Generator</h2>

<div class="input-box">
<i class="fa-solid fa-user"></i>
<input type="text" id="nameInput" placeholder="Student Name">
</div>

<div class="input-box">
<i class="fa-solid fa-id-card"></i>
<input type="text" id="rollInput" placeholder="Roll Number">
</div>

<div class="input-box">
<i class="fa-solid fa-book"></i>
<input type="text" id="classInput" placeholder="Class">
</div>

<div class="input-box">
<i class="fa-solid fa-graduation-cap"></i>
<input type="text" id="subjectInput" placeholder="Subject">
</div>

<div class="input-box">
<i class="fa-solid fa-calendar"></i>
<input type="text" id="sessionInput" placeholder="Session">
</div>

<div class="input-box">
<i class="fa-solid fa-clock"></i>
<input type="text" id="expiryInput" placeholder="Expire Date">
</div>

<div class="input-box">
<i class="fa-solid fa-phone"></i>
<input type="text" id="mobileInput" placeholder="Mobile Number">
</div>

<div class="input-box">
<i class="fa-solid fa-phone-volume"></i>
<input type="text" id="emergencyInput" placeholder="Emergency Mobile Number">
</div>

<div class="input-box">
<i class="fa-solid fa-user-tie"></i>
<input type="text" id="fatherInput" placeholder="Father Name">
</div>

<div class="input-box">
<i class="fa-solid fa-person-dress"></i>
<input type="text" id="motherInput" placeholder="Mother Name">
</div>

<div class="input-box">
<i class="fa-solid fa-location-dot"></i>
<input type="text" id="addressInput" placeholder="Address">
</div>

<div class="input-box">
<i class="fa-solid fa-droplet"></i>
<input type="text" id="bloodInput" placeholder="Blood Group">
</div>

<div class="input-box">
<i class="fa-solid fa-qrcode"></i>
<input type="text" id="qrInput" placeholder="QR Code Text">
</div>

<div class="input-box college-dropdown-box">
<i class="fa-solid fa-building"></i>

<input
type="text"
id="collegeSearch"
placeholder="Select College"
autocomplete="off"
onclick="toggleCollegeDropdown()"
oninput="filterCollegeList()"
>

<div id="collegeDropdown" class="college-dropdown"></div>
</div>

<label>Logo Mode</label>

<div class="input-box">
<i class="fa-solid fa-image"></i>
<select id="logoMode" onchange="updateLogoMode()">
<option value="transparent">Transparent Logo</option>
<option value="box">White Box Logo</option>
</select>
</div>

<label>Upload Profile Photo</label>
<div class="input-box">
<i class="fa-solid fa-image"></i>
<input type="file" id="photoInput" accept="image/*">
</div>

<label>Card Theme & Design</label>

<div class="theme-buttons">
<button type="button" class="theme-purple" onclick="setTheme('purple')">🟣</button>
<button type="button" class="theme-blue" onclick="setTheme('blue')">🔵</button>
<button type="button" class="theme-green" onclick="setTheme('green')">🟢</button>
<button type="button" class="theme-red" onclick="setTheme('red')">🔴</button>
<button type="button" class="theme-gold" onclick="setTheme('gold')">👑</button>
<button type="button" class="theme-ocean" onclick="setTheme('ocean')">🌊</button>
<button type="button" class="theme-sunset" onclick="setTheme('sunset')">🔥</button>
<button type="button" class="theme-black" onclick="setTheme('black')">⚫</button>
<button type="button" class="theme-classicblue" onclick="setTheme('classicblue')">🏫</button>
<button type="button" class="theme-brown" onclick="setTheme('brown')">🟤</button>
<button type="button" class="theme-violet" onclick="setTheme('violet')">💜</button>
<button type="button" class="theme-teal" onclick="setTheme('teal')">🩵</button>
</div>

<div class="input-box">
<i class="fa-solid fa-crosshairs"></i>
<select id="adjustTarget">
<option value="logo">Adjust Logo</option>
<option value="header">Adjust College Header</option>
</select>
</div>

<button type="button" class="reset-btn" onclick="resetAdjust()">
🔄 Reset Adjustment
</button>

<div class="logo-controls">
<button type="button" onclick="moveLogo('up')">⬆️</button>
<button type="button" onclick="resizeLogo('plus')">➕</button>
<button type="button" onclick="moveLogo('right')">➡️</button>

<button type="button" onclick="moveLogo('left')">⬅️</button>
<button type="button" onclick="resizeLogo('minus')">➖</button>
<button type="button" onclick="moveLogo('down')">⬇️</button>
</div>

<button class="btn" onclick="updateCard()">
Generate Card
</button>

</div>

<div class="id-card">

<img
id="cardWatermark"
style="
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
max-width:75%;
max-height:75%;
opacity:0.08;
pointer-events:none;
z-index:1;
display:none;
">

<div class="front-header">

<div id="collegeLogo" class="logo">
<img id="collegeLogoImg">
</div>

<div id="headerText" class="header-text">
<h1 id="collegeNameBn">College Name</h1>
<p id="collegeNameEn">College English</p>
<p class="estd" id="collegeEstablished">স্থাপিত: 2025 খ্রি.</p>
</div>

<div class="dept" id="deptText">ব্যবস্থাপনা বিভাগ</div>

</div>

<div class="photo-box">
<img id="studentPhoto">
</div>

<div class="student-name" id="studentName">
Student Name
</div>

<div class="info">
<div class="info-row"><div class="label">শ্রেণি</div><div>:</div><div id="studentClass">-</div></div>
<div class="info-row"><div class="label">রোল</div><div>:</div><div id="studentRoll">-</div></div>
<div class="info-row"><div class="label">সেশন</div><div>:</div><div id="studentSession">-</div></div>
<div class="info-row"><div class="label">মেয়াদ</div><div>:</div><div id="studentExpiry">-</div></div>
<div class="info-row"><div class="label">মোবাইল</div><div>:</div><div id="studentMobile">-</div></div>
</div>

<div class="signature">
<img id="principalSignature">
<p>অধ্যক্ষ</p>
</div>

<div class="front-bottom-design"></div>

</div>

<button class="btn" onclick="window.print()">
Print Card
</button>

<script type="module" src="js/app.js"></script>

</body>
</html>
